server {
  listen 80;
  server_name _;

  # Serve built SPA
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;

  # Vite's fingerprinted assets are safe to cache across deployments.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate the app entry point so it references the latest build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Proxy API to backend service name "backend" (docker-compose network) on port 3000
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Ensure cookies set by backend are preserved
    proxy_cookie_path ~*^/ /;
  }

  # Socket.IO WS upgrade
  location /socket.io/ {
    proxy_pass http://backend:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri /index.html;
  }
}
