# Render Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: convo
    env: docker
    plan: free
    autoDeploy: true
    # region: oregon   # optional; set your preferred region
    healthCheckPath: /healthz

    # Render will build using the Dockerfile at the repo root
    # (no buildCommand/startCommand needed for env: docker)

    envVars:
      # App runtime
      - key: NODE_ENV
        value: production
      # Render provides PORT automatically; backend will listen on PORT

      # Required
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: JWT_SECRET
        fromSecret: JWT_SECRET

      # CORS / client origin used in production
      # Set this to your Render service URL (after first deploy, update to your custom domain if used)
      - key: CLIENT_URL
        value: https://YOUR-SERVICE.onrender.com

      # Optional (leave unset if not used)
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: RESEND_API_KEY
        fromSecret: RESEND_API_KEY
      - key: EMAIL_FROM
        value: no-reply@example.com
      - key: EMAIL_FROM_NAME
        value: Convo
      - key: LOG_TO_FILES
        value: "false"
