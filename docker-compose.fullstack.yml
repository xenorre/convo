version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: convo-backend:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/convo
      JWT_SECRET: ${JWT_SECRET:?set in environment}
      CLIENT_URL: http://localhost # Not used when same-origin behind Nginx but kept for validations
      REDIS_URL: redis://redis:6379
      LOG_TO_FILES: "false"
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: 
    image: convo-frontend:prod
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: {}